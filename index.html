<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0879b9">
<title>부캉이 피하기 🦈</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#061c35;color:#f4fbff;font-family:system-ui,-apple-system,sans-serif;display:flex;justify-content:center;min-height:100vh}
.wrap{width:min(100%,620px);padding:14px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border:1px solid #39c7f4;background:linear-gradient(135deg,#075985,#103a72);border-radius:18px;margin-bottom:10px;box-shadow:0 8px 24px #0003}
h1{font-size:clamp(21px,5vw,30px);margin:0;font-weight:950;letter-spacing:-1px}.sub{font-size:12px;color:#bdeeff;margin-top:3px}.stats{display:flex;gap:8px}.stat{background:#06284d;border:1px solid #2779a9;border-radius:12px;padding:7px 12px;text-align:center;min-width:74px}.stat small{display:block;color:#a7e9ff;font-size:11px}.stat b{font-size:22px}
.stage{position:relative;border:2px solid #26bce9;border-radius:18px;overflow:hidden;background:#0878b9;box-shadow:0 10px 30px #0005}
canvas{display:block;width:100%;height:auto;touch-action:none}
.overlay{position:absolute;inset:0;background:#031b32b8;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}.panel{background:#06294beF;border:1px solid #5dd7ff;border-radius:20px;padding:22px 18px;max-width:330px;box-shadow:0 12px 40px #001b3d88}.big{font-size:62px;line-height:1.15}.panel h2{font-size:28px;margin:8px 0}.panel p{font-size:14px;line-height:1.7;color:#d5f5ff}.btn{border:0;border-radius:13px;background:#b7f34a;color:#18320b;font-size:17px;font-weight:900;padding:13px 22px;cursor:pointer;box-shadow:0 4px 0 #659d21}.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #659d21}
.controls{display:flex;justify-content:center;gap:18px;margin:12px 0}.move{flex:1;max-width:180px;height:68px;border:2px solid #65dfff;border-radius:18px;background:linear-gradient(#139ee0,#0871bc);color:white;font-size:30px;font-weight:900;touch-action:none;box-shadow:0 5px 0 #034e86;cursor:pointer}.move:active{transform:translateY(3px);box-shadow:0 2px 0 #034e86}.help{font-size:12px;text-align:center;color:#b9e9fb;line-height:1.7}.foot{display:flex;justify-content:space-between;gap:10px;margin-top:9px;font-size:11px;color:#8cc9e5}
@media(max-width:390px){.wrap{padding:8px}.top{padding:10px}.stat{min-width:61px;padding:6px}.stat b{font-size:19px}.controls{gap:12px}.move{height:60px}}
</style>
</head>
<body>
<main class="wrap">
<header class="top"><div><h1>🦈 부캉이 피하기</h1><div class="sub">바닷속에서 끝까지 살아남아라!</div></div><div class="stats"><div class="stat"><small>점수</small><b id="score">0</b></div><div class="stat"><small>최고 기록</small><b id="best">0</b></div></div></header>
<section class="stage"><canvas id="game" width="480" height="720" aria-label="부캉이 피하기 게임"></canvas>
<div class="overlay" id="overlay"><div class="panel"><div class="big" id="hero">🦈</div><h2 id="headline">부캉이 출동!</h2><p id="desc">좌우로 움직여 장애물을 피하라!<br>바위, 해파리, 복어와 지뢰를 조심해.<br><b>오래 버틸수록 점수가 올라간다.</b></p><button class="btn" id="start">게임 시작 ▶</button></div></div></section>
<div class="controls"><button class="move" id="left" aria-label="왼쪽 이동">◀</button><button class="move" id="right" aria-label="오른쪽 이동">▶</button></div>
<div class="help">키보드: ← → 또는 A / D &nbsp; · &nbsp; 모바일: 아래 버튼을 누르세요<br>장애물에 닿으면 게임 오버! 다시 시작해 최고 기록에 도전하세요.</div>
<div class="foot"><span>🌊 깊은 바다 생존 미션</span><span>한 번의 충돌도 용납 못 해!</span></div>
</main>
<script>
(()=>{
const c=document.getElementById('game'),x=c.getContext('2d'),W=480,H=720;
const scoreEl=document.getElementById('score'),bestEl=document.getElementById('best'),overlay=document.getElementById('overlay'),start=document.getElementById('start');
let best=0;try{best=+(localStorage.getItem('bukangiBest')||0)}catch(e){}bestEl.textContent=best;
let shark,obs,bubbles,score,time,last,spawn,run=false,keys={};
function rand(a,b){return a+Math.random()*(b-a)}
function rounded(a,b,w,h,r,color){x.fillStyle=color;x.beginPath();x.roundRect(a,b,w,h,r);x.fill()}
function background(t){
 let g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#35d4f5');g.addColorStop(.25,'#078bc9');g.addColorStop(1,'#063a79');x.fillStyle=g;x.fillRect(0,0,W,H);
 // sunbeams
 x.save();x.globalAlpha=.12;for(let i=-3;i<9;i++){x.fillStyle='#d9fbff';x.beginPath();x.moveTo(40+i*80,0);x.lineTo(95+i*80,0);x.lineTo(220+i*80,H);x.lineTo(150+i*80,H);x.closePath();x.fill()}x.restore();
 // distant reef silhouettes
 x.fillStyle='#075080';x.beginPath();x.moveTo(0,H);x.lineTo(0,510);x.quadraticCurveTo(45,480,65,540);x.lineTo(90,590);x.lineTo(120,720);x.fill();
 x.beginPath();x.moveTo(W,H);x.lineTo(W,480);x.quadraticCurveTo(430,520,405,565);x.lineTo(370,720);x.fill();
 // sea floor and coral
 x.fillStyle='#063663';x.beginPath();x.moveTo(0,680);x.quadraticCurveTo(120,650,210,690);x.quadraticCurveTo(350,655,480,685);x.lineTo(480,720);x.lineTo(0,720);x.fill();
 for(let i=0;i<10;i++){let bx=(i*67+22)%W,by=680-(i%3)*16;x.strokeStyle=i%2?'#29d6c3':'#ff8fc4';x.lineWidth=5;x.lineCap='round';x.beginPath();x.moveTo(bx,720);x.quadraticCurveTo(bx-8,by+15,bx-3,by);x.moveTo(bx,704);x.lineTo(bx-13,690);x.moveTo(bx,710);x.lineTo(bx+12,695);x.stroke()}
 // bubbles
 x.strokeStyle='#a9f3ff';x.lineWidth=1.5;
 for(let i=0;i<23;i++){let bx=(i*83+Math.sin(t*.7+i)*17)%W,by=(H-((t*48+i*79)%H));x.globalAlpha=.2+(i%3)*.12;x.beginPath();x.arc(bx,by,2+(i%4),0,Math.PI*2);x.stroke()}x.globalAlpha=1;
}
function drawShark(){
 let p=shark;x.save();x.translate(p.x,p.y);
 // tail
 x.fillStyle='#7dd3fc';x.beginPath();x.moveTo(-20,0);x.lineTo(-36,-15);x.lineTo(-34,4);x.lineTo(-38,18);x.closePath();x.fill();
 // fins
 x.fillStyle='#60bce9';x.beginPath();x.moveTo(-8,10);x.lineTo(-23,27);x.lineTo(-2,23);x.fill();x.beginPath();x.moveTo(10,10);x.lineTo(24,25);x.lineTo(5,22);x.fill();
 // body
 x.fillStyle='#72c9f3';x.beginPath();x.ellipse(0,0,27,34,0,0,Math.PI*2);x.fill();
 // belly
 x.fillStyle='#f4fbff';x.beginPath();x.ellipse(2,9,19,21,0,0,Math.PI*2);x.fill();
 // dorsal fin
 x.fillStyle='#8bd9fa';x.beginPath();x.moveTo(-10,-25);x.lineTo(0,-43);x.lineTo(12,-25);x.fill();
 // eyes and cheeks
 x.fillStyle='#102b45';x.beginPath();x.arc(-10,-11,3.5,0,7);x.arc(10,-11,3.5,0,7);x.fill();
 x.fillStyle='#ff9bb5';x.beginPath();x.arc(-17,0,4,0,7);x.arc(17,0,4,0,7);x.fill();
 // grin
 x.fillStyle='#172d43';x.beginPath();x.ellipse(0,1,13,10,0,0,Math.PI*2);x.fill();x.fillStyle='#fff';x.beginPath();x.moveTo(-10,-3);x.lineTo(-5,3);x.lineTo(0,-3);x.lineTo(5,3);x.lineTo(10,-3);x.lineTo(7,7);x.lineTo(-7,7);x.fill();
 x.restore();
}
function drawObstacle(o){
 x.save();x.translate(o.x,o.y);x.rotate(o.rot||0);
 if(o.type==='rock'){
 x.fillStyle='#657d8d';x.strokeStyle='#c3d2d9';x.lineWidth=3;x.beginPath();x.moveTo(-o.r*.8,-o.r*.35);x.lineTo(-o.r*.3,-o.r);x.lineTo(o.r*.6,-o.r*.8);x.lineTo(o.r,o.r*.05);x.lineTo(o.r*.5,o.r*.8);x.lineTo(-o.r*.55,o.r*.9);x.lineTo(-o.r,-o.r*.05);x.closePath();x.fill();x.stroke();
 }else if(o.type==='mine'){
 x.fillStyle='#253c55';x.strokeStyle='#ff6b78';x.lineWidth=3;for(let i=0;i<8;i++){x.rotate(Math.PI/4);x.fillRect(o.r-2,-3,12,6)}x.beginPath();x.arc(0,0,o.r,0,7);x.fill();x.stroke();x.fillStyle='#ff3b4e';x.beginPath();x.arc(0,0,o.r*.4,0,7);x.fill();
 }else if(o.type==='jelly'){
 x.fillStyle='#db9aff';x.strokeStyle='#ffe0ff';x.lineWidth=2;x.beginPath();x.arc(0,0,o.r,Math.PI,0);x.lineTo(o.r,o.r*.35);x.quadraticCurveTo(o.r*.5,o.r*.05,0,o.r*.35);x.quadraticCurveTo(-o.r*.5,o.r*.05,-o.r,o.r*.35);x.closePath();x.fill();x.stroke();x.strokeStyle='#f2c4ff';for(let j=-1;j<=1;j++){x.beginPath();x.moveTo(j*o.r*.5,o.r*.3);x.quadraticCurveTo(j*o.r*.7,o.r*.8,j*o.r*.35,o.r*1.15);x.stroke()}
 }else if(o.type==='puffer'){
 x.fillStyle='#ffb65b';x.strokeStyle='#fff0bc';x.lineWidth=2;for(let i=0;i<12;i++){x.rotate(Math.PI/6);x.beginPath();x.moveTo(o.r*.7,0);x.lineTo(o.r+9,-4);x.lineTo(o.r+9,4);x.closePath();x.fill()}x.beginPath();x.arc(0,0,o.r,0,7);x.fill();x.stroke();x.fillStyle='#17334a';x.beginPath();x.arc(-6,-3,2.5,0,7);x.arc(6,-3,2.5,0,7);x.fill();
 }else{
 rounded(-o.r*.45,-o.r,o.r*.9,o.r*2,5,'#39a76c');rounded(-o.r*.3,-o.r*.65,o.r*.6,o.r*.4,3,'#a8f5b5');
 }
 x.restore();
}
function spawnObs(){let type=['rock','rock','jelly','puffer','mine','trash'][Math.floor(Math.random()*6)],r=type==='rock'?rand(17,30):type==='jelly'?rand(17,23):type==='puffer'?rand(17,23):type==='mine'?rand(16,22):rand(13,18);obs.push({x:rand(35,W-35),y:-45,r,type,rot:rand(0,6),speed:rand(165,220)+Math.min(time*5,190),vx:rand(-20,20)})}
function draw(){background(time);obs.forEach(drawObstacle);drawShark();x.fillStyle='#e9fbff';x.font='bold 13px system-ui';x.fillText('생존 '+Math.floor(time)+'초',18,27)}
function endGame(){run=false;overlay.style.display='flex';document.getElementById('hero').textContent='💥';document.getElementById('headline').textContent='충돌! 게임 오버';document.getElementById('desc').innerHTML='이번 점수 <b style="color:#b7f34a">'+Math.floor(score)+'</b>점<br>최고 기록 <b style="color:#ffe37d">'+best+'</b>점<br>바닷속 재도전 갈까?';start.textContent='다시 도전 🔥';draw()}
function loop(ts){if(!run)return;let dt=Math.min((ts-last)/1000,.035);last=ts;time+=dt;score=Math.floor(time*10);scoreEl.textContent=score;
 let d=(keys.right?1:0)-(keys.left?1:0);shark.x=Math.max(34,Math.min(W-34,shark.x+d*310*dt));
 spawn-=dt;if(spawn<=0){spawnObs();spawn=Math.max(.28,.8-time*.006)+Math.random()*.25}
 for(let i=obs.length-1;i>=0;i--){let o=obs[i];o.y+=o.speed*dt;o.x+=o.vx*dt;if(o.x<25||o.x>W-25)o.vx*=-1;if(o.y>H+50){obs.splice(i,1);continue}
 let dx=o.x-shark.x,dy=o.y-shark.y;if(dx*dx+dy*dy<(o.r+21)*(o.r+21)*.78){best=Math.max(best,score);bestEl.textContent=best;try{localStorage.setItem('bukangiBest',best)}catch(e){}endGame();return}}
 draw();requestAnimationFrame(loop)}
function begin(){shark={x:W/2,y:H-105};obs=[];score=0;time=0;last=performance.now();spawn=.4;run=true;overlay.style.display='none';scoreEl.textContent='0';requestAnimationFrame(loop)}
function key(e,on){if(['ArrowLeft','ArrowRight','a','A','d','D'].includes(e.key))e.preventDefault();if(['ArrowLeft','a','A'].includes(e.key))keys.left=on;if(['ArrowRight','d','D'].includes(e.key))keys.right=on}
window.addEventListener('keydown',e=>key(e,true));window.addEventListener('keyup',e=>key(e,false));window.addEventListener('blur',()=>keys={});
function hold(id,dir){let b=document.getElementById(id);let down=e=>{e.preventDefault();keys[dir]=true},up=e=>{e.preventDefault();keys[dir]=false};b.addEventListener('pointerdown',down);['pointerup','pointercancel','pointerleave'].forEach(v=>b.addEventListener(v,up))}
hold('left','left');hold('right','right');start.addEventListener('click',begin);
background(0);shark={x:W/2,y:H-105};draw();
})();
</script>
</body></html>
